<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Order System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #e74c3c;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #e74c3c;
        }

        .size-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .size-option {
            flex: 1;
            min-width: 100px;
        }

        .size-option input {
            display: none;
        }

        .size-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .size-option input:checked + label {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        .size-option label:hover {
            border-color: #e74c3c;
        }

        .size-name {
            font-weight: 600;
            color: #333;
        }

        .size-price {
            color: #888;
            font-size: 0.9rem;
        }

        .toppings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .topping-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .topping-item:hover {
            border-color: #feca57;
        }

        .topping-item input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: #e74c3c;
        }

        .topping-item label {
            cursor: pointer;
            margin-bottom: 0;
            font-weight: normal;
            font-size: 0.95rem;
        }

        .topping-price {
            margin-left: auto;
            color: #888;
            font-size: 0.85rem;
        }

        .order-summary {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
        }

        .order-summary h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .summary-line:last-child {
            border-bottom: none;
        }

        .total-line {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e74c3c;
            border-top: 2px solid #e74c3c;
            margin-top: 10px;
            padding-top: 15px;
        }

        .order-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
        }

        .order-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pizza Order</h1>

        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Select Size</label>
            <div class="size-options">
                <div class="size-option">
                    <input type="radio" name="size" id="small" value="small" data-price="199">
                    <label for="small">
                        <span class="size-name">Small</span>
                        <span class="size-price">₱199</span>
                    </label>
                </div>
                <div class="size-option">
                    <input type="radio" name="size" id="medium" value="medium" data-price="299" checked>
                    <label for="medium">
                        <span class="size-name">Medium</span>
                        <span class="size-price">₱299</span>
                    </label>
                </div>
                <div class="size-option">
                    <input type="radio" name="size" id="large" value="large" data-price="399">
                    <label for="large">
                        <span class="size-name">Large</span>
                        <span class="size-price">₱399</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Select Toppings</label>
            <div class="toppings-grid">
                <div class="topping-item">
                    <input type="checkbox" id="pepperoni" value="Pepperoni" data-price="35">
                    <label for="pepperoni">Pepperoni</label>
                    <span class="topping-price">+₱35</span>
                </div>
                <div class="topping-item">
                    <input type="checkbox" id="mushrooms" value="Mushrooms" data-price="25">
                    <label for="mushrooms">Mushrooms</label>
                    <span class="topping-price">+₱25</span>
                </div>
                <div class="topping-item">
                    <input type="checkbox" id="onions" value="Onions" data-price="15">
                    <label for="onions">Onions</label>
                    <span class="topping-price">+₱15</span>
                </div>
                <div class="topping-item">
                    <input type="checkbox" id="sausage" value="Sausage" data-price="40">
                    <label for="sausage">Sausage</label>
                    <span class="topping-price">+₱40</span>
                </div>
                <div class="topping-item">
                    <input type="checkbox" id="bacon" value="Bacon" data-price="45">
                    <label for="bacon">Bacon</label>
                    <span class="topping-price">+₱45</span>
                </div>
                <div class="topping-item">
                    <input type="checkbox" id="olives" value="Olives" data-price="25">
                    <label for="olives">Olives</label>
                    <span class="topping-price">+₱25</span>
                </div>
                <div class="topping-item">
                    <input type="checkbox" id="peppers" value="Bell Peppers" data-price="20">
                    <label for="peppers">Bell Peppers</label>
                    <span class="topping-price">+₱20</span>
                </div>
                <div class="topping-item">
                    <input type="checkbox" id="cheese" value="Extra Cheese" data-price="30">
                    <label for="cheese">Extra Cheese</label>
                    <span class="topping-price">+₱30</span>
                </div>
            </div>
        </div>

        <div class="order-summary">
            <h2>Order Summary</h2>
            <div class="summary-line">
                <span>Pizza Size:</span>
                <span id="summarySize">Medium - ₱299</span>
            </div>
            <div class="summary-line">
                <span>Toppings:</span>
                <span id="summaryToppings">None</span>
            </div>
            <div class="summary-line">
                <span>Toppings Cost:</span>
                <span id="summaryToppingsPrice">₱0</span>
            </div>
            <div class="summary-line total-line">
                <span>Total:</span>
                <span id="totalPrice">₱299</span>
            </div>
        </div>

        <button class="order-btn" onclick="placeOrder()">Place Order</button>
    </div>

    <script>
        // Get all elements
        const sizeInputs = document.querySelectorAll('input[name="size"]');
        const toppingInputs = document.querySelectorAll('.topping-item input[type="checkbox"]');
        const summarySize = document.getElementById('summarySize');
        const summaryToppings = document.getElementById('summaryToppings');
        const summaryToppingsPrice = document.getElementById('summaryToppingsPrice');
        const totalPrice = document.getElementById('totalPrice');
        const customerName = document.getElementById('customerName');

        // Calculate and update total
        function calculateTotal() {
            let basePrice = 0;
            let toppingsPrice = 0;
            let selectedSize = '';
            let selectedToppings = [];

            // Get selected size
            sizeInputs.forEach(input => {
                if (input.checked) {
                    basePrice = parseFloat(input.dataset.price);
                    selectedSize = input.value.charAt(0).toUpperCase() + input.value.slice(1);
                }
            });

            // Get selected toppings
            toppingInputs.forEach(input => {
                if (input.checked) {
                    toppingsPrice += parseFloat(input.dataset.price);
                    selectedToppings.push(input.value);
                }
            });

            // Update summary
            summarySize.textContent = `${selectedSize} - ₱${basePrice}`;
            summaryToppings.textContent = selectedToppings.length > 0 ? selectedToppings.join(', ') : 'None';
            summaryToppingsPrice.textContent = `₱${toppingsPrice}`;

            const total = basePrice + toppingsPrice;
            totalPrice.textContent = `₱${total}`;
        }

        // Add event listeners
        sizeInputs.forEach(input => {
            input.addEventListener('change', calculateTotal);
        });

        toppingInputs.forEach(input => {
            input.addEventListener('change', calculateTotal);
        });

        // Place order function
        function placeOrder() {
            const name = customerName.value.trim();

            if (!name) {
                alert('Please enter your name!');
                customerName.focus();
                return;
            }

            let selectedSize = '';
            sizeInputs.forEach(input => {
                if (input.checked) {
                    selectedSize = input.value;
                }
            });

            let selectedToppings = [];
            toppingInputs.forEach(input => {
                if (input.checked) {
                    selectedToppings.push(input.value);
                }
            });

            const total = totalPrice.textContent;
            const toppingsText = selectedToppings.length > 0 ? selectedToppings.join(', ') : 'No extra toppings';

            alert(`Order Confirmed!\n\nCustomer: ${name}\nSize: ${selectedSize.charAt(0).toUpperCase() + selectedSize.slice(1)}\nToppings: ${toppingsText}\nTotal: ${total}\n\nThank you for your order!`);
        }

        // Initial calculation
        calculateTotal();
    </script>
</body>
</html>
